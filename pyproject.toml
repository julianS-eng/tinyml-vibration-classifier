[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinyml-vibration-classifier"
version = "0.1.0"
description = "TinyML vibration classifier for predictive maintenance: normal / imbalance / bearing fault (inner & outer race) detection on ESP32-S3."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TinyML Vibration Classifier contributors" }]
keywords = [
    "tinyml",
    "predictive-maintenance",
    "vibration-analysis",
    "bearing-fault-diagnosis",
    "esp32",
    "tflite-micro",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<2.2",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "tensorflow>=2.16,<2.20; sys_platform != 'darwin'",
    "tensorflow-macos>=2.16,<2.20; sys_platform == 'darwin'",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
]

[project.scripts]
tinyml-vibration = "tinyml_vibration.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyml_vibration"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["tinyml_vibration"]

[tool.mypy]
python_version = "3.11"
packages = ["tinyml_vibration"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
